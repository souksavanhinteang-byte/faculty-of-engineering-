<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="Ideas today. Impact tomorrow. Explore ten engineering disciplines and student life at the National University of Laos. An independent bilingual student project."
    />
    <meta property="og:title" content="Faculty of Engineering · NUOL" />
    <meta
      property="og:description"
      content="For curious minds. For those who build. Explore engineering at the National University of Laos."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Faculty of Engineering · NUOL</title>
    <!-- Critical entrance styles stay in HTML so the shell needs no application assets. -->
    <style id="nuol-entrance-styles">
      #nuol-entrance {
        position: fixed;
        inset: 0;
        width: 100vw;
        z-index: 10000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 32px 24px;
        overflow: auto;
        background: #fff;
        color: #102c54;
        font-family: 'Segoe UI', 'Noto Sans Lao', 'Phetsarath OT', sans-serif;
        line-height: 1.6;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      #nuol-entrance[hidden],
      #nuol-entrance [hidden] {
        display: none !important;
      }
      #nuol-entrance .entrance-grid {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #nuol-entrance .entrance-content {
        position: relative;
        width: min(100%, 380px);
      }
      #nuol-entrance .entrance-logo {
        display: block;
        width: 88px;
        height: auto;
        margin: 0 auto 20px;
        object-fit: contain;
      }
      #nuol-entrance .entrance-name {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.8;
      }
      #nuol-entrance .entrance-name span,
      #nuol-entrance-status span {
        display: block;
      }
      #nuol-entrance .entrance-name [lang='en'] {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #nuol-entrance .entrance-drawing {
        display: block;
        width: 188px;
        height: 106px;
        margin: 26px auto 14px;
        fill: none;
        stroke: #102c54;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.45;
      }
      #nuol-entrance .entrance-drawing .entrance-trace {
        stroke-dasharray: 1;
        stroke-dashoffset: calc(1 - var(--entrance-progress, 0));
      }
      #nuol-entrance .entrance-counter {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 6px;
        margin: 0 0 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: clamp(64px, 12vw, 88px);
        font-weight: 300;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.06em;
        line-height: 1.1;
      }
      #nuol-entrance .entrance-counter small {
        font-size: 23px;
        font-weight: 400;
        letter-spacing: 0;
      }
      #nuol-entrance .entrance-track {
        height: 1px;
        margin: 0 20px 20px;
        overflow: hidden;
        background: #eef4fa;
      }
      #nuol-entrance .entrance-line {
        height: 100%;
        background: #102c54;
        transform: scaleX(var(--entrance-progress, 0.01));
        transform-origin: left;
      }
      #nuol-entrance-status {
        margin: 0;
        font-size: 13px;
        line-height: 1.9;
      }
      #nuol-entrance-status [lang='en'] {
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      #nuol-entrance-retry {
        min-height: 44px;
        margin-top: 20px;
        padding: 8px 20px;
        border: 1px solid #102c54;
        border-radius: 2px;
        background: #fff;
        color: #102c54;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #nuol-entrance-retry:hover {
        background: #eef4fa;
      }
      #nuol-entrance-retry:focus-visible {
        outline: 2px solid #102c54;
        outline-offset: 4px;
      }
      #nuol-entrance[data-state='waiting'] .entrance-line {
        width: 32%;
        animation: entrance-wait 1.4s ease-in-out infinite alternate;
      }
      #nuol-entrance[data-state='failed'] .entrance-line {
        transform: none;
      }
      #nuol-entrance[data-state='exiting'] {
        pointer-events: none;
        transform: translateY(-100%);
        transition: transform 480ms cubic-bezier(0.76, 0, 0.24, 1);
      }
      @keyframes entrance-wait {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(212.5%);
        }
      }
      @media (max-height: 600px) {
        #nuol-entrance {
          padding-block: 20px;
        }
        #nuol-entrance .entrance-logo {
          width: 64px;
          margin-bottom: 12px;
        }
        #nuol-entrance .entrance-drawing {
          height: 64px;
          margin-block: 12px;
        }
        #nuol-entrance .entrance-counter {
          font-size: 64px;
          margin-bottom: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #nuol-entrance .entrance-drawing,
        #nuol-entrance .entrance-counter {
          display: none;
        }
        #nuol-entrance .entrance-track {
          margin-top: 24px;
        }
        #nuol-entrance .entrance-line,
        #nuol-entrance[data-state='waiting'] .entrance-line {
          animation: none;
          transform: none;
          width: 100%;
        }
        #nuol-entrance[data-state='exiting'] {
          transition: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <section id="nuol-entrance" aria-label="NUOL" data-state="entering" hidden>
      <svg class="entrance-grid" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="entrance-grid-pattern" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0V48" fill="none" stroke="#EEF4FA" stroke-width="1" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#entrance-grid-pattern)" />
      </svg>
      <div class="entrance-content">
        <img
          class="entrance-logo"
          src="/picture/logo.jpg"
          alt=""
          width="640"
          height="640"
          decoding="async"
          fetchpriority="high"
        />
        <p class="entrance-name">
          <span lang="lo">ຄະນະວິສະວະກຳສາດ</span>
          <span lang="en">Faculty of Engineering · NUOL</span>
        </p>
        <svg class="entrance-drawing" viewBox="0 0 240 136" aria-hidden="true">
          <path d="M16 116H224M32 124v-8m176 8v-8" opacity=".25" />
          <path
            class="entrance-trace"
            pathLength="1"
            d="m40 96 91 29 69-39-91-29-69 39Zm0-32 91 29 69-39-91-29-69 39Zm0 0v32m91-3v32m69-71v32M40 32v32m91-3v32m69-71v32M40 32l91 29 69-39-91-15-69 25Zm0 0 40-22 51 51M80 10l69-7 51 19M85 47v64m80-69v64M40 64l45 47m0-64 46 78m0-32 34 13m0-64 35 44"
          />
        </svg>
        <!-- Decorative entrance timing, deliberately not an ARIA/network progress bar. -->
        <div class="entrance-counter" aria-hidden="true">
          <span id="nuol-entrance-number">1</span><small>%</small>
        </div>
        <div class="entrance-track" aria-hidden="true"><div class="entrance-line"></div></div>
        <p id="nuol-entrance-status" role="status" aria-live="polite" aria-atomic="true">
          <span lang="lo">ກຳລັງກຽມໜ້າເວັບ</span>
          <span lang="en">Preparing your experience</span>
        </p>
        <button id="nuol-entrance-retry" type="button" hidden>
          <span lang="lo">ລອງໃໝ່</span> · <span lang="en">Retry</span>
        </button>
      </div>
    </section>
    <div id="root"></div>
    <noscript>
      <p lang="lo">
        ກະລຸນາເປີດ JavaScript ເພື່ອໃຊ້ເວັບນີ້ ຫຼື
        <a href="https://fe-nuol.edu.la/">ເຂົ້າເບິ່ງເວັບທາງການຂອງຄະນະ</a>.
      </p>
      <p lang="en">
        Please enable JavaScript to use this website, or
        <a href="https://fe-nuol.edu.la/en/">visit the faculty's official website</a>.
      </p>
    </noscript>
    <script>
      // This controller runs before any module downloads; it never starts or delays the app.
      ;(() => {
        const overlay = document.getElementById('nuol-entrance')
        const root = document.getElementById('root')
        const number = document.getElementById('nuol-entrance-number')
        const counter = overlay.querySelector('.entrance-counter')
        const status = document.getElementById('nuol-entrance-status')
        const retry = document.getElementById('nuol-entrance-retry')
        const preference = matchMedia('(prefers-reduced-motion: reduce)')
        const sessionKey = 'nuol-entrance-seen'
        let seen = true
        try {
          seen = sessionStorage.getItem(sessionKey) === '1'
        } catch {
          /* Skip choreography if storage is unavailable. */
        }
        const started = performance.now()
        const duration = 600 // With the 480ms exit, a fast first visit takes about 1.1s.
        let animate = !seen && !preference.matches
        let ready = false
        let disposed = false
        let frame = 0
        let slowTimer = 0
        let retryTimer = 0
        let exitTimer = 0
        const originalInert = root.inert
        root.inert = true

        function show() {
          overlay.hidden = false
        }
        function setStatus(lo, en) {
          status.querySelector('[lang="lo"]').textContent = lo
          status.querySelector('[lang="en"]').textContent = en
        }
        function cancelWork() {
          cancelAnimationFrame(frame)
          clearTimeout(slowTimer)
          clearTimeout(retryTimer)
          clearTimeout(exitTimer)
        }
        function releasePage() {
          root.inert = originalInert
          // No document scrolling styles are changed, so the hero keeps its exact geometry.
        }
        function dispose() {
          if (disposed) return
          disposed = true
          cancelWork()
          releasePage()
          preference.removeEventListener('change', onPreference)
          overlay.removeEventListener('transitionend', onTransition)
          root.removeEventListener('focusin', onFocus)
          window.removeEventListener('error', onResourceError, true)
          window.removeEventListener('pagehide', dispose)
          retry.removeEventListener('click', reload)
          overlay.remove()
          document.getElementById('nuol-entrance-styles')?.remove()
          delete window.__nuolEntrance
        }
        function finish() {
          if (disposed || overlay.dataset.state === 'exiting') return
          cancelWork()
          number.textContent = '100'
          overlay.style.setProperty('--entrance-progress', '1')
          try {
            sessionStorage.setItem(sessionKey, '1')
          } catch {
            /* Optional storage. */
          }
          if (!animate || overlay.hidden) {
            dispose()
            return
          }
          // Begin the exit immediately, without an extra hold at 100%.
          overlay.dataset.state = 'exiting'
          root.inert = originalInert
          exitTimer = setTimeout(dispose, 550) // Cleanup also works if transitionend is lost.
        }
        function tick(now) {
          if (disposed || overlay.dataset.state !== 'entering') return
          const elapsed = Math.min((now - started) / duration, 1)
          const progress = 1 - Math.pow(1 - elapsed, 2)
          number.textContent = String(Math.round(1 + progress * 94))
          overlay.style.setProperty('--entrance-progress', String(progress * 0.95))
          if (elapsed === 1) {
            if (ready) finish()
          } else frame = requestAnimationFrame(tick)
        }
        function waiting() {
          if (disposed || ready || overlay.dataset.state === 'failed') return
          cancelAnimationFrame(frame)
          show()
          overlay.dataset.state = 'waiting'
          counter.hidden = true
          overlay.style.setProperty('--entrance-progress', '1')
          setStatus('ກຳລັງໂຫຼດໜ້າເວັບ…', 'Still loading the website…')
        }
        function fail() {
          if (disposed) return
          cancelWork()
          ready = false
          show()
          overlay.dataset.state = 'failed'
          counter.hidden = true
          root.inert = originalInert
          overlay.style.setProperty('--entrance-progress', '1')
          setStatus(
            'ບໍ່ສາມາດໂຫຼດໜ້າເວັບໄດ້. ກະລຸນາລອງໃໝ່.',
            'The website could not load. Please try again.',
          )
          retry.hidden = false
        }
        function onPreference() {
          if (!preference.matches) return
          animate = false
          cancelAnimationFrame(frame)
          counter.hidden = true
          if (ready) dispose()
        }
        function onTransition(event) {
          if (event.target === overlay && event.propertyName === 'transform' && ready) dispose()
        }
        function onFocus() {
          if (ready) dispose()
        }
        function onResourceError(event) {
          // Also cover a failed build entry, before its dynamic-import catch can execute.
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') fail()
        }
        function reload() {
          window.location.reload()
        }

        window.__nuolEntrance = {
          ready() {
            if (disposed || ready || overlay.dataset.state === 'failed') return
            ready = true
            clearTimeout(slowTimer)
            clearTimeout(retryTimer)
            if (!animate || performance.now() - started >= duration) finish()
          },
          fail,
        }
        preference.addEventListener('change', onPreference)
        overlay.addEventListener('transitionend', onTransition)
        root.addEventListener('focusin', onFocus)
        window.addEventListener('error', onResourceError, true)
        window.addEventListener('pagehide', dispose)
        retry.addEventListener('click', reload)
        if (!seen) show()
        counter.hidden = !animate
        if (animate) frame = requestAnimationFrame(tick)
        slowTimer = setTimeout(waiting, 2000)
        // A stalled request is not necessarily a failure: keep waiting, but offer recovery.
        retryTimer = setTimeout(() => {
          if (disposed || ready || overlay.dataset.state === 'failed') return
          waiting()
          setStatus(
            'ການໂຫຼດໃຊ້ເວລາດົນກວ່າປົກກະຕິ. ທ່ານສາມາດລອງໃໝ່ໄດ້.',
            'This is taking longer than usual. You can try again.',
          )
          retry.hidden = false
        }, 12000)
      })()
    </script>
    <script type="module">
      // Import immediately and catch failures anywhere in the essential JS/CSS module graph.
      import('/src/main.tsx').catch((error) => {
        window.__nuolEntrance?.fail()
        console.error('Application startup failed', error)
      })
    </script>
  </body>
</html>
